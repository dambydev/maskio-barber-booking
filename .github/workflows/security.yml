name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "18 3 * * 1"
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run OWASP ZAP against vars.STAGING_URL"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep SAST scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config .semgrep/custom-rules.yml \
            --severity ERROR \
            --error \
            --json \
            --output semgrep-results.json \
            .

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn

  sca-scan:
    name: SCA and IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        id: trivy_fs
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: json
          output: trivy-fs-results.json

      - name: Run Trivy IaC and config scan
        id: trivy_config
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: json
          output: trivy-iac-results.json

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload Trivy results and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: |
            trivy-*.json
            sbom.cdx.json
          if-no-files-found: warn

      - name: Enforce Trivy security gate
        if: steps.trivy_fs.outcome == 'failure' || steps.trivy_config.outcome == 'failure'
        run: |
          echo "BLOCKED: Trivy found high or critical dependency/IaC findings."
          exit 1

  dast-scan:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_URL != '' && (github.event_name == 'schedule' || inputs.run_dast == true) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: ignore

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-scan
      - sca-scan
      - dast-scan
    if: always()
    steps:
      - name: Check scan results
        run: |
          echo "Checking security scan results..."

          if [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "BLOCKED: Secrets detected in repository history or current tree."
            exit 1
          fi

          if [[ "${{ needs.sast-scan.result }}" == "failure" ]]; then
            echo "BLOCKED: Semgrep found blocking SAST findings."
            exit 1
          fi

          if [[ "${{ needs.sca-scan.result }}" == "failure" ]]; then
            echo "BLOCKED: Trivy found high or critical SCA/IaC findings."
            exit 1
          fi

          if [[ "${{ needs.dast-scan.result }}" == "failure" ]]; then
            echo "BLOCKED: OWASP ZAP found blocking DAST findings."
            exit 1
          fi

          echo "All enabled security gates passed."
